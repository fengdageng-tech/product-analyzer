<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跨境产品开发 · 分析报告工具</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%2338bdf8%27/%3E%3Crect x=%2712%27 y=%2714%27 width=%2740%27 height=%2736%27 rx=%274%27 fill=%27%23ffffff26%27/%3E%3Crect x=%2718%27 y=%2722%27 width=%2728%27 height=%273%27 rx=%271.5%27 fill=%27white%27/%3E%3Crect x=%2718%27 y=%2728%27 width=%2720%27 height=%273%27 rx=%271.5%27 fill=%27%23ffffffb3%27/%3E%3Crect x=%2718%27 y=%2734%27 width=%2724%27 height=%273%27 rx=%271.5%27 fill=%27%23ffffff80%27/%3E%3Ccircle cx=%2737%27 cy=%2741%27 r=%277%27 fill=%27%234ade80%27/%3E%3Cpath d=%27M33 41 l3 3 l6-6%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
    --input-bg: #0f172a;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 16px;
    max-width: 680px;
    margin: 0 auto;
  }

  h1 {
    font-size: 20px;
    text-align: center;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; background: var(--card);
    border: 1px solid var(--border); color: var(--muted); transition: all 0.2s;
  }
  .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; }

  /* Form */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
  label .unit { font-weight: 400; color: var(--muted); }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 15px;
    font-family: inherit; resize: vertical; -webkit-appearance: none;
  }
  textarea { min-height: 80px; }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
  }
  /* 提示字压暗：明显弱于正文，避免误认为已填写的内容 */
  input::placeholder, textarea::placeholder {
    color: rgba(148,163,184,0.45);
    opacity: 1;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* Buttons */
  .btn {
    display: block; width: 100%; padding: 12px; border-radius: 8px; font-size: 15px;
    font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; text-align: center;
  }
  .btn-primary { background: var(--accent); color: #0f172a; }
  .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); margin-top: 8px; }
  .btn-sm { display: inline; padding: 6px 14px; font-size: 12px; width: auto; border-radius: 6px; }
  .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

  /* Report Card */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 14px;
  }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .product-name { font-size: 17px; font-weight: 700; line-height: 1.4; }
  .verdict {
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
    white-space: nowrap; flex-shrink: 0; margin-left: 8px;
  }
  .verdict.go { background: rgba(74,222,128,0.15); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
  .verdict.wait { background: rgba(251,191,36,0.15); color: var(--yellow); border: 1px solid rgba(251,191,36,0.3); }
  .verdict.skip { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
  .verdict.none { background: rgba(148,163,184,0.15); color: var(--muted); border: 1px solid rgba(148,163,184,0.3); }

  /* 定制/公模切换 */
  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button {
    flex: 1; padding: 10px; border-radius: 8px; border: 1.5px solid var(--border);
    background: transparent; color: var(--muted); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .type-toggle button.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }

  /* ML2 指标格 */
  .ml2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .ml2-grid .ml2-item {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;
  }
  .ml2-grid .ml2-item .k { color: var(--muted); }
  .ml2-grid .ml2-item .v { font-weight: 700; }

  /* 定制成本红线盒 */
  .ceiling-box {
    background: var(--input-bg); border-left: 3px solid var(--yellow);
    border-radius: 8px; padding: 14px; font-size: 14px; line-height: 1.9;
  }
  .ceiling-box .big { font-size: 22px; font-weight: 800; color: var(--yellow); }
  .seg.none { background: var(--border); }

  /* 参考链接 */
  .link-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .ext-link {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
    border-radius: 8px; background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.25); color: var(--accent);
    font-size: 12px; font-weight: 600; text-decoration: none; word-break: break-all;
  }
  .ext-link:active { opacity: 0.7; }

  /* 定价实时结果 */
  .live-box {
    margin-top: 8px; padding: 10px 12px; border-radius: 8px;
    background: rgba(56,189,248,0.06); border: 1px solid rgba(56,189,248,0.2);
    font-size: 13px; line-height: 1.8;
  }
  .live-box .big { font-size: 20px; font-weight: 800; margin: 0 2px; }
  .live-box .k { color: var(--muted); font-size: 12px; }

  .price-compare {
    font-size: 13px; color: var(--muted); margin: -6px 0 12px;
    padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
  }
  .price-compare .arrow { color: var(--accent); margin: 0 4px; }

  /* 字段分组标题 */
  .group-title {
    font-size: 13px; font-weight: 700; color: var(--accent);
    margin: 20px 0 10px; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .group-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .req { color: var(--red); font-weight: 700; }

  /* 悬浮生成按钮 + 常驻 ML2 读数 */
  .generate-sticky {
    position: sticky; bottom: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 0 12px; background: var(--bg);
  }
  .generate-sticky .btn-primary { flex: 1; box-shadow: 0 4px 20px rgba(56,189,248,0.35); }
  .sticky-ml2 {
    display: none; flex-shrink: 0; font-size: 13px; font-weight: 800;
    padding: 10px 12px; border-radius: 8px; white-space: nowrap;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  }
  .sticky-ml2.show { display: block; }
  #panel-analyze { padding-bottom: 8px; }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .metric {
    text-align: center; padding: 10px 6px; border-radius: 8px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  }
  .metric .value { font-size: 20px; font-weight: 800; }
  .metric .label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .metric .value.green { color: var(--green); }
  .metric .value.yellow { color: var(--yellow); }
  .metric .value.red { color: var(--red); }
  .metric .value.blue { color: var(--accent); }

  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-top: 16px; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag {
    padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: rgba(56,189,248,0.1); color: var(--accent); border: 1px solid rgba(56,189,248,0.2);
  }
  .tag.bad {
    background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.2);
  }
  .tag.neutral {
    background: rgba(148,163,184,0.1); color: var(--muted); border: 1px solid rgba(148,163,184,0.2);
  }

  .reason-box {
    background: var(--input-bg); border-radius: 8px; padding: 14px;
    border-left: 3px solid var(--accent); font-size: 14px; line-height: 1.8;
  }
  .reason-box li { margin-left: 16px; margin-bottom: 4px; }
  .reason-box li::marker { color: var(--accent); }

  /* Product List */
  .product-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .product-item .body { flex: 1; min-width: 0; }
  .list-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); background: rgba(0,0,0,0.3); }
  .item-del { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; }
  .item-del:hover { border-color: var(--red); color: var(--red); background: rgba(248,113,113,0.1); }
  .product-item:active { border-color: var(--accent); }
  .product-item .top { display: flex; justify-content: space-between; align-items: center; }
  .product-item .name { font-weight: 700; font-size: 15px; flex: 1; }
  .product-item .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .product-item .actions { display: flex; gap: 6px; margin-top: 8px; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #0f172a; padding: 10px 24px;
    border-radius: 20px; font-weight: 700; font-size: 14px; z-index: 999;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* File input */
  #importFile { display: none; }

  /* Competitor section */
  .collapsible { margin-bottom: 14px; }
  .collapsible-trigger { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer; padding: 10px 0; user-select: none; }
  .collapsible-trigger .arrow { transition: transform 0.2s; font-size: 10px; }
  .collapsible.open > .collapsible-trigger .arrow { transform: rotate(90deg); }
  .collapsible-body { display: none; }
  .collapsible.open > .collapsible-body { display: block; }
  .competitor-card { background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; position: relative; }
  .competitor-card .remove-btn { position: absolute; top: 8px; right: 10px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--red); background: transparent; color: var(--red); font-size: 14px; cursor: pointer; line-height: 1; }
  .add-comp-btn { font-size: 12px; color: var(--accent); background: transparent; border: 1px dashed var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; width: 100%; font-family: inherit; }

  /* Comparison table */
  .comparison-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 12px 0; }
  .comparison-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
  .comparison-table th { background: rgba(56,189,248,0.08); color: var(--accent); padding: 8px 6px; text-align: center; font-size: 11px; white-space: nowrap; }
  .comparison-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
  .comparison-table .highlight { color: var(--green); font-weight: 700; }
  .comparison-table .warn { color: var(--yellow); }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-card .stat-value { font-size: 22px; font-weight: 800; }
  .stat-card .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .stat-bar .seg { height: 100%; }
  .seg.go { background: var(--green); }
  .seg.wait { background: var(--yellow); }
  .seg.skip { background: var(--red); }

  /* GitHub Sync */
  .sync-section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .sync-section .sync-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .sync-section .sync-sub { font-size: 10px; color: var(--muted); margin-bottom: 8px; }
  .sync-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .sync-row input { flex: 1; font-size: 12px; padding: 6px 8px; }
  .btn-sync { padding: 6px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: inherit; white-space: nowrap; flex-shrink: 0; border: 1px solid var(--border); background: transparent; color: var(--text); transition: all 0.2s; }
  .btn-sync.up { border-color: var(--accent); color: var(--accent); }
  .btn-sync.down { border-color: var(--green); color: var(--green); }
  .btn-sync:active { transform: scale(0.97); opacity: 0.8; }
  .sync-status { font-size: 11px; margin-top: 4px; min-height: 16px; flex-basis: 100%; line-height: 1.5; }
  .sync-status.ok { color: var(--green); }
  .sync-status.err { color: var(--red); }
  .cloud-info { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .cloud-info b { color: var(--accent); }
  .token-state { font-size: 11px; margin-bottom: 8px; }
  .token-state.ok { color: var(--green); }
  .token-state.warn { color: var(--yellow); }
  .auto-sync-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
  .auto-sync-label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  /* Custom toggle */
  .auto-sync-label input[type=checkbox] { display: none; }
  .toggle-track { width: 36px; height: 20px; border-radius: 10px; background: var(--border); position: relative; transition: background 0.2s; flex-shrink: 0; }
  .toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
  .auto-sync-label input:checked + .toggle-track { background: var(--accent); }
  .auto-sync-label input:checked + .toggle-track::after { transform: translateX(16px); }
  .token-link { font-size: 11px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .token-link:hover { color: var(--accent); }

  /* Override */
  .override-bar { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .override-bar .btn-o { padding: 5px 12px; font-size: 11px; border-radius: 16px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); font-weight: 600; transition: all 0.15s; font-family: inherit; }
  .override-bar .btn-o.go-active { background: rgba(74,222,128,0.15); color: var(--green); border-color: var(--green); }
  .override-bar .btn-o.wait-active { background: rgba(251,191,36,0.15); color: var(--yellow); border-color: var(--yellow); }
  .override-bar .btn-o.skip-active { background: rgba(248,113,113,0.15); color: var(--red); border-color: var(--red); }
  .override-note { margin-top: 8px; }
  .override-note input { font-size: 13px; padding: 8px 12px; }
  .overridden-mark { font-size: 11px; color: var(--accent); margin-left: 4px; }

  /* Image upload */
  .image-upload-row { display: flex; gap: 8px; }
  .image-upload-row input { flex: 1; }
  .image-upload-row .btn-sm { white-space: nowrap; flex-shrink: 0; padding: 10px 16px; font-size: 13px; }
  .image-preview-wrap { margin-top: 8px; display: none; position: relative; }
  .image-preview-wrap.show { display: inline-block; }
  .image-preview-wrap img { width: 100%; max-width: 300px; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .image-preview-wrap .clear-img { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: #fff; border: none; cursor: pointer; font-size: 14px; line-height: 1; }
  .card-img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; margin-bottom: 14px; background: rgba(0,0,0,0.3); }

  /* Export btn */
  .export-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-export { flex: 1; padding: 8px; font-size: 12px; border-radius: 8px; background: transparent; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; font-weight: 600; font-family: inherit; }
  .btn-export:active { background: rgba(56,189,248,0.1); }

  /* Print */
  @media print {
    body { background: #fff; color: #000; max-width: 100%; padding: 0; }
    .tabs, .btn, .btn-export, .btn-outline, .btn-sm, .btn-danger, .export-row, .override-bar, .override-note, .collapsible-trigger, .add-comp-btn, .remove-btn, #reportOutput { margin: 0; }
    .card { border: 1px solid #ddd; break-inside: avoid; }
    .btn, .btn-export, .btn-outline, .btn-sm, .btn-danger, .export-row, .override-bar, .override-note { display: none !important; }
  }

  /* Responsive */
  @media (max-width: 400px) {
    .metric-grid { grid-template-columns: 1fr 1fr; }
    .row, .row-3 { grid-template-columns: 1fr; }
    .card-header { flex-direction: column; }
    .verdict { margin-left: 0; margin-top: 8px; align-self: flex-start; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<h1>产品分析报告</h1>
<div class="subtitle">跨境产品开发 · 判断工具（欧洲站）</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('analyze')">🔍 分析产品</div>
  <div class="tab" onclick="switchTab('history')">📋 历史记录</div>
</div>

<!-- ====== Analyze Panel ====== -->
<div class="panel active" id="panel-analyze">

  <div class="group-title">🛒 产品信息</div>
  <div class="form-group">
    <label>产品名称 <span class="req">*</span></label>
    <input id="productName" placeholder="">
  </div>
  <div class="row">
    <div class="form-group">
      <label>ASIN</label>
      <input id="asin" placeholder="B0XXXXXXXX">
    </div>
    <div class="form-group">
      <label>重量 <span class="unit">(克)</span> <span class="req">*</span></label>
      <input id="weightG" type="number" step="1" placeholder="" oninput="autoFillFba();updateLivePrice()">
    </div>
  </div>
  <div class="form-group">
    <label>尺寸级别 <span class="unit">(决定配送费档位)</span></label>
    <select id="sizeTier" onchange="autoFillFba()">
      <option value="小包裹" selected>小包裹 · ≤35×25×12cm（≤3900克）</option>
      <option value="标准包裹">标准包裹 · ≤45×34×26cm（≤11900克）</option>
      <option value="轻型信封">轻型信封 · ≤33×23×2.5cm（≤100克）</option>
      <option value="标准信封">标准信封 · ≤33×23×2.5cm（≤460克）</option>

<script>
// ==================== DATA LAYER ====================
const STORAGE_KEY = 'product_analyzer_db_v2'; // v2：欧洲站口径，旧美元数据弃用

// ==================== 运费查表（亚马逊物流欧洲整合服务 · 本地配送）====================
// 取「仅限德国」列，不含中欧计划；单位欧元/件。数据来源：用户提供的费率表截图

const COUNTRY_NAMES = { DE: '德国', FR: '法国', IT: '意大利', ES: '西班牙' };
// 每档：[重量上限(KG), 配送费(€)]
const FBA_RATES = {

    大信封: [[0.96, 4.39]],
    超大信封: [[0.96, 4.72]],
    小包裹: [[0.15, 4.56], [0.40, 5.07], [0.90, 5.79], [1.4, 5.87], [1.9, 6.10], [3.9, 9.10]],
    标准包裹: [[0.15, 4.58], [0.40, 5.40], [0.90, 6.28], [1.4, 6.41], [1.9, 6.84], [2.9, 9.36], [3.9, 9.55], [5.9, 9.67], [8.9, 10.53], [11.9, 11.03]],
  },
  IT: {
    轻型信封: [[0.02, 3.23], [0.04, 3.26], [0.06, 3.28], [0.08, 3.39], [0.10, 3.41]],

    小包裹: [[0.15, 4.13], [0.40, 4.54], [0.90, 4.95], [1.4, 5.51], [1.9, 5.81], [3.9, 6.93]],
    标准包裹: [[0.15, 4.29], [0.40, 4.70], [0.90, 5.15], [1.4, 5.81], [1.9, 6.05], [2.9, 6.71], [3.9, 6.96], [5.9, 7.25], [8.9, 8.04], [11.9, 8.63]],
  },
  ES: {
    轻型信封: [[0.02, 2.77], [0.04, 2.84], [0.06, 2.87], [0.08, 3.21], [0.10, 3.23]],
    标准信封: [[0.21, 3.26], [0.46, 3.45]],
    大信封: [[0.96, 3.60]],
    超大信封: [[0.96, 3.85]],
    小包裹: [[0.15, 3.52], [0.40, 3.74], [0.90, 3.95], [1.4, 4.21], [1.9, 4.27], [3.9, 5.50]],
    标准包裹: [[0.15, 3.55], [0.40, 4.05], [0.90, 4.45], [1.4, 4.85], [1.9, 4.94], [2.9, 4.98], [3.9, 5.53], [5.9, 7.02], [8.9, 7.24], [11.9, 7.85]],
  },
};

function fmtKg(kg) {
  return kg < 1 ? Math.round(kg * 1000) + '克' : kg + '千克';
}

// 表单以「克」输入，内部统一换算成公斤查表/算头程
function getWeightKg() {
  const g = parseFloat(document.getElementById('weightG').value) || 0;
  return g / 1000;
}

function lookupFba(country, tier, weightKg) {
  const rows = (FBA_RATES[country] || FBA_RATES.DE)[tier];
  if (!rows || !rows.length || !(weightKg > 0)) return null;
  for (let i = 0; i < rows.length; i++) {
    if (weightKg <= rows[i][0] + 1e-9) {
      return { fee: rows[i][1], max: rows[i][0], label: fmtKg(rows[i][0]) };
    }
  }
  return { over: true, max: rows[rows.length - 1][0] };
}

// keepValue=true 时只更新提示、不覆盖用户已填的配送费（回看历史记录时用）
function autoFillFba(keepValue) {
  const country = document.getElementById('vatCountry').value || 'DE';
  const tier = document.getElementById('sizeTier').value || '小包裹';
  const weightKg = getWeightKg();
  const feeEl = document.getElementById('fbaFee');
  const hint = document.getElementById('fbaHint');
  const res = lookupFba(country, tier, weightKg);
  const tierHint = document.getElementById('tierHint');
  if (!res) { if (hint) hint.textContent = ''; if (tierHint) tierHint.textContent = ''; return; }
  if (res.over) {
    hint.style.color = 'var(--yellow)';
    hint.textContent = '⚠ 超重：' + tier + ' 上限 ' + fmtKg(res.max) + '，请选更大的尺寸级别';
    if (tierHint) { tierHint.style.color = 'var(--yellow)'; tierHint.textContent = '⚠ 超出该尺寸级别上限（' + fmtKg(res.max) + '）'; }
    if (keepValue !== true) feeEl.value = '';
    return;
  }
  if (keepValue !== true) feeEl.value = res.fee.toFixed(2);
  const msg = COUNTRY_NAMES[country] + ' · ' + tier + ' · ≤' + res.label + ' → €' + res.fee.toFixed(2);
  hint.style.color = 'var(--accent)';
  hint.textContent = msg + '（自动查表）';
  if (tierHint) { tierHint.style.color = 'var(--accent)'; tierHint.textContent = msg + '　自动填入配送费'; }
}

function toggleRateTable() {
  const sec = document.getElementById('rateTableSection');
  sec.classList.toggle('open');
  if (sec.classList.contains('open')) renderRateTable();
}

function renderRateTable() {
  const body = document.getElementById('rateTableBody');
  if (!body) return;
  const country = document.getElementById('vatCountry').value || 'DE';
  const tier = document.getElementById('sizeTier').value || '小包裹';
  const rates = FBA_RATES[country] || FBA_RATES.DE;
  const rows = rates[tier] || [];
  const hit = lookupFba(country, tier, getWeightKg());
  let html = '<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">' + COUNTRY_NAMES[country] + ' · ' + tier + ' · 欧元/件（仅限本国列）</div>';
  html += '<table class="comparison-table" style="min-width:0;"><tr><th>重量段</th><th>配送费</th></tr>';
  rows.forEach(([max, fee]) => {
    const isHit = hit && !hit.over && hit.max === max;
    html += '<tr' + (isHit ? ' class="highlight"' : '') + '><td style="text-align:left;">≤' + fmtKg(max) + (isHit ? ' ←当前' : '') + '</td><td>€' + fee.toFixed(2) + '</td></tr>';
  });
  html += '</table>';
  body.innerHTML = html;
}

// ==================== ANALYSIS ENGINE（欧洲站 ML2 口径）====================
const VAT_RATES = { DE: 0.19, FR: 0.20, IT: 0.22, ES: 0.21 };

function analyzeProduct(data) {
  const compPrice = parseFloat(data.price) || 0;      // 竞品售价（市场参考）
  const myPrice = parseFloat(data.myPrice) || 0;      // 我的定价（算利润用）
  const price = myPrice || compPrice;                 // 没填我的定价就沿用竞品价
  const sales = parseInt(data.monthlySales) || 0;
  const reviews = parseInt(data.reviewCount) || 0;
  const rating = parseFloat(data.rating) || 0;
  const costCNY = parseFloat(data.cost1688) || 0;
  const weightG = parseFloat(data.weightG) || 0;
  const weightKg = weightG / 1000;
  const tcRate = parseFloat(data.tcRate) || 0;
  const hl = parseFloat(data.hl) || 7.3;
  const fbaFee = parseFloat(data.fbaFee) || 0;
  const sizeTier = data.sizeTier || '小包裹';
  const fbaLookup = lookupFba(data.vatCountry || 'DE', sizeTier, weightKg);
  const vat = VAT_RATES[data.vatCountry] || 0.19;
  const prodType = data.prodType || 'gongmo';
  const targetMargin = (parseFloat(data.targetMargin) || 30) / 100;

  const BM = 0.22;          // 仓储+杂费扣点（ML2表德法口径）
  const COMMISSION = 0.154; // 平台佣金 15.4%

  // 评论/评分门槛（市场面参考色，不下结论）
  let reviewLevel, reviewLabel;
  if (reviews < 100) { reviewLevel = 'green'; reviewLabel = '低门槛'; }
  else if (reviews < 300) { reviewLevel = 'yellow'; reviewLabel = '中等门槛'; }
  else { reviewLevel = 'red'; reviewLabel = '高壁垒'; }

  let ratingLevel;
  if (rating >= 4.3) ratingLevel = 'green';
  else if (rating >= 3.8) ratingLevel = 'yellow';
  else ratingLevel = 'red';

  // ---- 利润核算（公模且填了采购成本才算；定制成本未定）----
  const hasProfit = prodType !== 'dingzhi' && costCNY > 0 && price > 0;
  let profit = null;
  if (hasProfit) {
    const tu = weightKg * tcRate + costCNY;              // 人民币总成本（采购+头程）
    const cb = tu / hl;                                  // 成本€（头程摊入）
    const referralFee = price * COMMISSION;
    const vatAmount = price * vat / (1 + vat);
    const ml = price - referralFee - cb - fbaFee - vatAmount;
    const ml2 = price > 0 ? ml / price : 0;
    const hb = price * ml2 * hl;                         // 人民币毛利
    const hb2 = tu > 0 ? hb / tu : 0;                    // 成本回报倍数
    const floorPrice = (cb + fbaFee) / (0.846 - vat / (1 + vat) - BM);
    const floorAcos = (price - 0.05 * price - 0.153 * price - 0.95 * price * vat / (1 + vat) - cb - fbaFee - 0.5) / price;
    const promoPrice30 = (cb + fbaFee + 0.5) / (1 - 0.05 - COMMISSION - 0.95 * vat / (1 + vat) - BM);
    const refBid = ml / 10;

    // 达标售价：ML2 达到目标利润率所需的最低售价
    const denom = 0.846 - vat / (1 + vat) - targetMargin;
    const targetPrice = denom > 0 ? (cb + fbaFee) / denom : Infinity;
    const targetGap = targetPrice === Infinity ? null : targetPrice - price;

    profit = {
      tu: tu.toFixed(2), cb: cb.toFixed(2), referralFee: referralFee.toFixed(2),
      vatAmount: vatAmount.toFixed(2), vatPct: Math.round(vat * 100),
      ml: ml.toFixed(2), ml2: (ml2 * 100).toFixed(1),
      hb: hb.toFixed(1), hb2: hb2.toFixed(2),
      floorPrice: floorPrice.toFixed(2), floorAcos: (floorAcos * 100).toFixed(1),
      promoPrice30: promoPrice30.toFixed(2), refBid: refBid.toFixed(2),
      targetPrice: targetPrice === Infinity ? null : targetPrice.toFixed(2),
      targetGap: targetGap === null ? null : targetGap.toFixed(2),
      targetPct: Math.round(targetMargin * 100),
      reached: ml2 >= targetMargin,
    };
  }

  // ---- 定制成本红线（成本未定时反推打样询价上限）----
  let costCeiling = null;
  if (!hasProfit && price > 0) {
    const val = (price * (0.846 - vat / (1 + vat)) - fbaFee - price * targetMargin) * hl - weightKg * tcRate;
    costCeiling = { value: val.toFixed(2), targetPct: Math.round(targetMargin * 100), ok: val > 0 };
  }

  // Negative review analysis
  const rawText = data.negativeReviews || '';
  const lines = rawText.split(/[\n,，。、；;]+/).filter(l => l.trim());
  const keywords = [
    { word: '薄|透|太轻|单薄', cat: '面料偏薄', type: 'bad' },
    { word: '吸水性|吸水|不吸水|水渍', cat: '吸水性差', type: 'bad' },
    { word: '颜色|色差|掉色|褪色|染色', cat: '颜色/色差', type: 'bad' },
    { word: '尺寸|太小|太大|长度|宽度|短|长|偏小|偏大', cat: '尺寸偏差', type: 'bad' },
    { word: '包装|破损|碎了|压坏|变形|物流', cat: '包装/运输', type: 'bad' },
    { word: '味道|气味|异味|臭|甲醛', cat: '异味', type: 'bad' },
    { word: '质量|太差|劣质|粗糙|不值', cat: '质量感差', type: 'bad' },
    { word: '电池|没电|充电|续航|发烫|短路', cat: '电池/电路', type: 'bad' },
    { word: '安装|不好装|装不上|不稳|晃动', cat: '安装困难', type: 'bad' },
    { word: '粘|不粘|脱落|粘性|胶水|贴不住', cat: '粘性不足', type: 'bad' },
    { word: '掉毛|起球|缩水|变形|起皱|掉色|褪色', cat: '面料耐久性', type: 'bad' },
    { word: '拉链|扣子|缝线|开线|线头|拉链坏', cat: '做工细节', type: 'bad' },
    { word: '噪音|太吵|声音大|吵|静音|嗡嗡', cat: '噪音问题', type: 'bad' },
    { word: '生锈|掉漆|氧化|变色|发黄|褪色', cat: '材质老化', type: 'bad' },
    { word: '划痕|瑕疵|二手|用过|翻新|拆过', cat: '品控/翻新', type: 'bad' },
    { word: '说明书|看不懂|没有英文|英文说明|不会用|操作', cat: '使用说明', type: 'bad' },
    { word: '过敏|起疹|皮肤|痒|红肿|刺激', cat: '过敏反应', type: 'bad' },
    { word: '售后|退货|退款|客服|不理人|联系不上', cat: '售后体验', type: 'bad' },
    { word: '清洗|洗|不耐洗|洗衣机|手洗', cat: '清洗便利性', type: 'neutral' },
    { word: '漂亮|好看|精致|可爱|喜欢|满意|不错|推荐|值|好评|棒|完美|惊喜|很好|完美', cat: '正向评价', type: 'good' },
    { word: '装饰|摆件|好看就行|当装饰|外观|颜值', cat: '装饰用途', type: 'neutral' },
  ];

  const categories = {};
  let categorized = 0;
  lines.forEach(line => {
    let matched = false;
    for (const kw of keywords) {
      if (new RegExp(kw.word, 'i').test(line)) {
        if (!categories[kw.cat]) categories[kw.cat] = { count: 0, type: kw.type, examples: [] };
        categories[kw.cat].count++;
        if (categories[kw.cat].examples.length < 2) categories[kw.cat].examples.push(line.trim().slice(0, 30));
        matched = true;
        categorized++;
        break;
      }
    }
    if (!matched) {
      if (!categories['其他']) categories['其他'] = { count: 0, type: 'neutral', examples: [] };
      categories['其他'].count++;
    }
  });

  const totalLines = lines.length;
  const badCategories = Object.entries(categories).filter(([_, v]) => v.type === 'bad').sort((a, b) => b[1].count - a[1].count);
  const topBad = badCategories.slice(0, 3);
  const fixableCategories = ['面料偏薄', '吸水性差', '颜色/色差', '尺寸偏差', '包装/运输', '异味', '质量感差', '安装困难', '粘性不足'];
  const hardCategories = ['电池/电路'];

  const fixableCount = badCategories.filter(([k]) => fixableCategories.includes(k)).reduce((s, [_, v]) => s + v.count, 0);
  const hardCount = badCategories.filter(([k]) => hardCategories.includes(k)).reduce((s, [_, v]) => s + v.count, 0);
  const totalBad = badCategories.reduce((s, [_, v]) => s + v.count, 0);

  return {
    price, compPrice, myPrice, sales, reviews, rating, costCNY, prodType,
    weightG, weightKg, tcRate, hl, fbaFee, vat, sizeTier,
    fbaBracket: fbaLookup && fbaLookup.label ? fbaLookup.label : null,
    hasProfit, profit, costCeiling,
    reviewLevel, reviewLabel, ratingLevel,
    categories, totalLines, badCategories, topBad,
    fixableCount, hardCount, totalBad,
  };
}

// 改定价/成本即实时显示 ML2，不用点生成报告
function updateLivePrice() {
  const box = document.getElementById('livePriceBox');
  const chip = document.getElementById('stickyMl2');
  const hideAll = () => { if (box) box.innerHTML = ''; if (chip) chip.classList.remove('show'); };
  if (!box) return;
  const d = readFormValues();
  const usedPrice = parseFloat(d.myPrice) || parseFloat(d.price) || 0;

  if (!usedPrice) { hideAll(); box.innerHTML = '<span class="k">填「我的定价」或「竞品价」后实时显示 ML2</span>'; return; }
  if (!d.weightG) { hideAll(); box.innerHTML = '<span class="k">先填重量，才能算配送费</span>'; return; }
  if (d.prodType === 'gongmo' && !d.cost1688) { hideAll(); box.innerHTML = '<span class="k">填入 1688 采购成本后显示 ML2</span>'; return; }

  const r = analyzeProduct(d);
  if (!r.profit) { hideAll(); box.innerHTML = '<span class="k">数据不足，无法计算</span>'; return; }
  const p = r.profit;
  const m = parseFloat(p.ml2);
  const color = m >= p.targetPct ? 'var(--green)' : m >= p.targetPct * 0.66 ? 'var(--yellow)' : 'var(--red)';
  const priceNote = r.myPrice ? '' : '（沿用竞品价）';
  const gap = p.targetGap === null ? null : parseFloat(p.targetGap);
  const gapHtml = p.targetPrice === null
    ? '<span style="color:var(--red);">该目标利润率在当前成本下无法达到</span>'
    : (gap > 0
      ? `还差 <b style="color:var(--yellow);">€${gap.toFixed(2)}</b> 才达标（需 ≥ €${p.targetPrice}）`
      : `已达标 ✓（最低 €${p.targetPrice} 即可）`);

  box.innerHTML =
    `售价 €${r.price.toFixed(2)}${priceNote}　→　ML2 <span class="big" style="color:${color};">${p.ml2}%</span>　利润 €${p.ml}` +
    `<br><span class="k">达标线 ${p.targetPct}%：${gapHtml}</span>`;

  if (chip) {
    chip.textContent = 'ML2 ' + p.ml2 + '%';
    chip.style.color = color;
    chip.classList.add('show');
  }
}

function generateReport() {
  const data = readFormValues();

  if (!data.productName) { showToast('⚠️ 请至少填写产品名称'); return; }
  if (!data.price && !data.myPrice) { showToast('⚠️ 请填写「我的定价」或「竞品售价」'); return; }
  if (!data.weightG) { showToast('⚠️ 重量为必填项（算头程运费用）'); return; }
  if (!data.fbaFee) {
    document.getElementById('costParamSection').classList.add('open');
    const lk = lookupFba(data.vatCountry || 'DE', data.sizeTier || '小包裹', (parseFloat(data.weightG) || 0) / 1000);
    showToast(lk && lk.over ? '⚠ 重量超出该尺寸级别上限，请选更大的尺寸级别' : '⚠ 请在「成本与参数」里填写FBA配送费');
    return;
  }
  if (data.prodType === 'gongmo' && !data.cost1688) {
    document.getElementById('costParamSection').classList.add('open');
    showToast('⚠️ 公模产品需填写1688采购成本');
    return;
  }

  const r = analyzeProduct(data);

  // Analyze competitors（税点/汇率/头程沿用主产品）
  const competitors = [];
  document.querySelectorAll('.competitor-card').forEach(card => {
    const cData = {
      productName: card.querySelector('.comp-name')?.value?.trim() || '',
      price: card.querySelector('.comp-price')?.value || '',
      monthlySales: card.querySelector('.comp-sales')?.value || '',
      reviewCount: card.querySelector('.comp-reviews')?.value || '',
      rating: card.querySelector('.comp-rating')?.value || '',
      cost1688: card.querySelector('.comp-cost')?.value || '',
      weightKg: card.querySelector('.comp-weight')?.value || '',
      fbaFee: card.querySelector('.comp-fba')?.value || '',
      prodType: 'gongmo',
      tcRate: data.tcRate, hl: data.hl, vatCountry: data.vatCountry,
      negativeReviews: '',
    };
    if (cData.productName) {
      const cr = analyzeProduct(cData);
      competitors.push({ data: cData, result: cr });
    }
  });

  data.result = r;
  data.competitors = competitors;
  data.imageData = currentImageData || data.imageData || null;
  data.createdAt = new Date().toISOString();

  // Save（保留已有记录的判断与备注）
  const products = loadProducts();
  const existingIdx = products.findIndex(p => p.asin && p.asin === data.asin);
  const existing = existingIdx >= 0 ? products[existingIdx] : null;
  data.manualVerdict = (existing && existing.manualVerdict) || null;
  data.manualNote = (existing && existing.manualNote) || '';
  data.autoVerdict = existing ? !!existing.autoVerdict : false;
  data.imageData = data.imageData || (existing && existing.imageData) || null;

  // 利润核算不出来 → 自动标暂缓；核算得出来 → 清掉自动暂缓（手动标记不受影响）
  if (!r.hasProfit) {
    if (!data.manualVerdict || data.autoVerdict) { data.manualVerdict = '暂缓'; data.autoVerdict = true; }
  } else if (data.autoVerdict) {
    data.manualVerdict = null; data.autoVerdict = false;
  }

  if (existingIdx >= 0) {
    products[existingIdx] = data;
  } else {
    products.unshift(data);
  }
  saveProducts(products);

  renderReport(data, r);
  document.getElementById('reportOutput').scrollIntoView({ behavior: 'smooth' });
  showToast('✅ 报告已生成并保存');

  // Auto-sync to GitHub if enabled
  if (isAutoSync() && getToken()) {
    uploadToGithub().catch(() => {});
  }
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      const existing = loadProducts();
      const merged = [...data, ...existing];
      // dedup by asin
      const seen = new Set();
      const deduped = merged.filter(p => {
        const key = p.asin || p.productName || '';
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      saveProducts(deduped);
      renderProductList();
      showToast('📥 导入成功 · ' + deduped.length + '条记录');
    } catch(err) {
      showToast('⚠️ 文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// Image upload
let currentImageData = null; // { type: 'url'|'base64', value: string }

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxW = 400;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      currentImageData = { type: 'base64', value: dataUrl };
      document.getElementById('imageUrl').value = '';
      showImagePreview(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 只放行 http/https，顺手补全漏写的协议；其他（javascript: 等）一律拒掉
function normalizeUrl(raw) {
  let u = (raw || '').trim();
  if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) {
    // 没写协议：形如 detail.1688.com/xxx 就补 https
    if (/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u)) u = 'https://' + u;
    else return '';
  }
  return /^https?:\/\//i.test(u) ? u : '';
}

function escapeAttr(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Statistics panel
function renderStats() {
  const products = loadProducts();
  const panel = document.getElementById('statsPanel');
  if (!products.length) { panel.innerHTML = ''; return; }

  const total = products.length;
  const goCount = products.filter(p => p.manualVerdict === '能做').length;
  const waitCount = products.filter(p => p.manualVerdict === '暂缓').length;
  const skipCount = products.filter(p => p.manualVerdict === '不做').length;
  const noneCount = total - goCount - waitCount - skipCount;

  const margins = products.map(p => parseFloat(p.result?.profit?.ml2) || 0).filter(m => m > 0);
  const avgMargin = margins.length ? (margins.reduce((a,b)=>a+b,0) / margins.length).toFixed(1) : '—';

  const dates = products.map(p => p.createdAt).filter(Boolean).sort();
  const latest = dates.length ? new Date(dates[dates.length - 1]).toLocaleDateString('zh-CN') : '—';

  const goPct = total > 0 ? Math.round(goCount/total*100) : 0;
  const waitPct = total > 0 ? Math.round(waitCount/total*100) : 0;
  const skipPct = total > 0 ? Math.round(skipCount/total*100) : 0;
  const nonePct = Math.max(0, 100 - goPct - waitPct - skipPct);

  panel.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">📊 总分析数</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--accent);">${avgMargin}%</div><div class="stat-label">📈 平均 ML2</div></div>
      <div class="stat-card">
        <div class="stat-value" style="font-size:14px;">
          <span style="color:var(--green);">✅${goCount}</span> <span style="color:var(--yellow);">⏸${waitCount}</span> <span style="color:var(--red);">🚫${skipCount}</span> <span style="color:var(--muted);">⚪${noneCount}</span>
        </div>
        <div class="stat-label">我的判断 · 能做/暂缓/不做/未标</div>
        <div class="stat-bar">
          <div class="seg go" style="width:${goPct}%;"></div>
          <div class="seg wait" style="width:${waitPct}%;"></div>
          <div class="seg skip" style="width:${skipPct}%;"></div>
          <div class="seg none" style="width:${nonePct}%;"></div>
        </div>
      </div>
      <div class="stat-card"><div class="stat-value" style="font-size:16px;">${latest}</div><div class="stat-label">🕐 最近分析</div></div>
    </div>
  `;
}

const GITHUB_API = 'https://api.github.com/repos/fengdageng-tech/product-analyzer/contents/data.json';
const PAGES_DATA_URL = 'https://fengdageng-tech.github.io/product-analyzer/data.json';
const TOKEN_KEY = 'github_sync_token';
const AUTO_SYNC_KEY = 'github_auto_sync';
const CLOUD_SEEN_KEY = 'cloud_last_seen';

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || '';
}

function saveToken() {

}

// 读取云端条数 + 显示本机条数，点同步前先心里有数
async function refreshCloudInfo() {
  const el = document.getElementById('cloudInfo');
  const ts = document.getElementById('tokenState');
  if (ts) {
    const has = !!getToken();
    ts.textContent = has ? 'Token：已设置 ✅' : 'Token：未设置 ⚠️ 上传需要它，下载不需要';
    ts.className = 'token-state ' + (has ? 'ok' : 'warn');
  }
  if (!el) return;
  const localN = loadProducts().length;
  el.innerHTML = `本机 <b>${localN}</b> 条 · 云端读取中…`;
  try {
    const res = await fetch(PAGES_DATA_URL + '?_=' + Date.now(), { cache: 'no-cache' });
    if (!res.ok) throw new Error(String(res.status));
    const remote = await res.json();
    const last = localStorage.getItem(CLOUD_SEEN_KEY);
    el.innerHTML = `本机 <b>${localN}</b> 条 · 云端 <b>${Array.isArray(remote) ? remote.length : 0}</b> 条`
      + (last ? ` · 上次同步 ${last}` : '');
  } catch (e) {
    el.innerHTML = `本机 <b>${localN}</b> 条 · 云端读取失败（检查网络）`;
  }
}

async function uploadToGithub() {
  const token = getToken();
  if (!token) {
    setSyncStatus('❌ 还没设置 Token —— 上传必须要有它，这次没有发出去', 'err');
    showToast('❌ 未设置 Token，上传没发出去');
    showTokenPrompt();
    return;
  }
  setSyncStatus('⏳ 读取云端后合并上传…', '');
  try {
    // 先读云端（公开读，不需要 token），避免覆盖掉别的设备上传的记录
    let remote = [];
    try {
      const r = await fetch(PAGES_DATA_URL + '?_=' + Date.now(), { cache: 'no-cache' });
      if (r.ok) { const d = await r.json(); if (Array.isArray(d)) remote = d; }
    } catch (e) {}

    const keyOf = p => p.asin || p.productName || '';
    const map = new Map();
    remote.forEach(p => map.set(keyOf(p), p));   // 云端原有
    loadProducts().forEach(p => map.set(keyOf(p), p)); // 本机版本优先覆盖同名
    const merged = Array.from(map.values());

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(merged, null, 2))));
    let sha = null;
    const getRes = await fetch(GITHUB_API, { headers: { Authorization: 'Bearer ' + token } });

    if (getRes.status === 401) {
      setSyncStatus('❌ Token 无效或已过期，请重新生成一个再粘进来', 'err');
      showToast('❌ Token 失效');
      showTokenPrompt();
      return;
    }
    if (getRes.status === 403 || getRes.status === 404) {
      setSyncStatus('❌ Token 权限不足：需要该仓库 Contents 的读+写权限', 'err');
      showToast('❌ Token 权限不够');
      return;
    }
    if (getRes.ok) { const info = await getRes.json(); sha = info.sha; }

    const body = { message: '☁ 云同步', content };
    if (sha) body.sha = sha;
    const res = await fetch(GITHUB_API, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      saveProducts(merged);
      localStorage.setItem(CLOUD_SEEN_KEY, new Date().toLocaleString('zh-CN'));
      setSyncStatus(`✅ 已上传 ${merged.length} 条（云端原有 ${remote.length} 条，已合并）`, 'ok');
      showToast('☁ 已同步 ' + merged.length + ' 条');
      refreshCloudInfo();
      renderProductList();
      renderStats();
    } else if (res.status === 401) {
      setSyncStatus('❌ Token 无效或已过期，请重新生成一个再粘进来', 'err');
      showToast('❌ Token 失效');
      showTokenPrompt();
    } else if (res.status === 403 || res.status === 404) {
      setSyncStatus('❌ Token 权限不足：需要该仓库 Contents 的读+写权限', 'err');
      showToast('❌ Token 权限不够');
    } else {
      const err = await res.json().catch(() => ({}));
      setSyncStatus('❌ 上传失败：' + (err.message || ('HTTP ' + res.status)), 'err');
      showToast('❌ 上传失败 ' + res.status);
    }
  } catch (e) {
    setSyncStatus('❌ 网络错误：连不上 GitHub，可能需要挂代理', 'err');
    showToast('❌ 网络错误，上传失败');
  }
}

async function downloadFromGithub() {
  setSyncStatus('⏳ 下载中…', '');
  try {
    // 从 GitHub Pages 读公开文件，不需要 token
    const res = await fetch(PAGES_DATA_URL + '?_=' + Date.now(), { cache: 'no-cache' });
    if (!res.ok) {
      setSyncStatus(res.status === 404 ? '❌ 云端暂无数据，请先在电脑上「上传」一次' : '❌ 下载失败 HTTP ' + res.status, 'err');
      return;
    }
    const remote = await res.json();
    if (!Array.isArray(remote)) throw new Error('格式错误');
    if (remote.length === 0) {
      setSyncStatus('⚠️ 云端是空的（0 条）—— 先在那台有数据的设备上点「上传」', 'err');
      showToast('⚠️ 云端还是空的，没有可下载的记录');
      return;
    }
    // 合并：同名以云端为准，本机独有记录保留
    const local = loadProducts();
    const merged = [...remote];
    const seen = new Set(merged.map(p => p.asin || p.productName || ''));
    local.forEach(p => {
      const key = p.asin || p.productName || '';
      if (!seen.has(key)) { merged.push(p); seen.add(key); }
    });
    saveProducts(merged);
    localStorage.setItem(CLOUD_SEEN_KEY, new Date().toLocaleString('zh-CN'));
    renderProductList();
    renderStats();
    refreshCloudInfo();
    setSyncStatus(`✅ 已从云端同步 ${remote.length} 条，本机现共 ${merged.length} 条`, 'ok');
    showToast('⬇ 已同步 ' + remote.length + ' 条');
  } catch(e) {
    setSyncStatus('❌ 下载失败：网络错误', 'err');
  }
}

function showTokenPrompt() {
  document.getElementById('tokenRow').style.display = 'block';
  document.getElementById('githubToken').focus();
}

function initSyncUI() {
  const hasToken = !!getToken();
  document.getElementById('tokenRow').style.display = hasToken ? 'none' : 'block';
  document.getElementById('autoSyncCheck').checked = isAutoSync();
  document.getElementById('githubToken').value = '';
  refreshCloudInfo();
}

// ==================== UTILS ====================
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (name === 'analyze' && i === 0) || (name === 'history' && i === 1));
  });
  document.getElementById('panel-analyze').classList.toggle('active', name === 'analyze');
  document.getElementById('panel-history').classList.toggle('active', name === 'history');
  if (name === 'history') { renderStats(); renderProductList(); initSyncUI(); }
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== INIT ====================
(function init() {
  // 表单不再预填示例数据——示例都在各字段的灰色提示（placeholder）里
  updateLivePrice();
  // Auto-pull from cloud on page load (free, no token needed)
  autoPullFromCloud();
})();

async function autoPullFromCloud() {
  try {
    var url = 'https://fengdageng-tech.github.io/product-analyzer/data.json?_=' + Date.now();
    var res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) return;
    var remote = await res.json();
    if (!Array.isArray(remote) || !remote.length) return;
    var local = loadProducts();
    if (!local.length) {
      // New device, no local data — just load from cloud
      saveProducts(remote);
      return;
    }
    // Merge: remote data wins, keep local-only entries
    var merged = remote.slice();
    var seen = new Set(merged.map(function(p) { return p.asin || p.productName || ''; }));
    local.forEach(function(p) {
      var key = p.asin || p.productName || '';
      if (!seen.has(key)) { merged.push(p); seen.add(key); }
    });
    if (merged.length !== local.length) {
      saveProducts(merged);
    }
  } catch(e) {
    // Silent fail — cloud sync is optional
  }
}
